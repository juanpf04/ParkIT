<div th:fragment="register-form">

    <h2 id="register-heading">Registro de Parker</h2>

    <form method="post" th:action="@{/confirm-register}">

        <div class="row mt-3">
            <label for="role" class="form-label">Rol:</label>
            <div class="input-group">
                <select class="form-select-lg w-100" name="role" id="role">
                    <option th:value="USER">Parker</option>
                    <option th:value="ENTERPRISE">Empresa</option>
                </select>
            </div>
        </div>

        <div class="row mt-3">
            <label for="username" class="form-label">Nombre de usuario:</label>
            <div class="input-group">
                <input type="text" class="form-control" name="username" id="username" aria-describedby="username" />
            </div>
        </div>

        <div class="row mt-3">
            <label for="password" class="form-label">Contraseña:</label>
            <div class="input-group">
                <input type="text" class="form-control" name="password" id="password" aria-describedby="password" />
            </div>
        </div>

        <div class="row mt-3">
            <label for="repeatPassword" class="form-label">Repetir contraseña:</label>
            <div class="input-group">
                <input type="text" class="form-control" name="repeatPassword" id="repeatPassword"
                    aria-describedby="repeatPassword" />
            </div>
        </div>

        <div class="row mt-3">
            <div class="col">
                <label for="telephone" class="form-label">Teléfono:</label>
                <div class="input-group">
                    <input type="text" class="form-control" name="telephone" id="telephone"
                        aria-describedby="telephone" />
                </div>
            </div>

            <div class="col">
                <label for="email" class="form-label">Email:</label>
                <div class="input-group">
                    <input type="email" class="form-control" name="email" id="email" aria-describedby="email" />
                </div>
            </div>
        </div>

        <div class="row mt-3" id="form-parker">
            <div class="col">
                <label for="dni" class="form-label">DNI:</label>
                <div class="input-group">
                    <input type="text" class="form-control" name="dni" id="dni" aria-describedby="dni" />
                </div>
            </div>

            <div class="col">
                <label for="firstName" class="form-label">Nombre:</label>
                <div class="input-group">
                    <input type="text" class="form-control" name="firstName" id="firstName"
                        aria-describedby="firstName" />
                </div>
            </div>

            <div class="col">
                <label for="secondName" class="form-label">Apellido:</label>
                <div class="input-group">
                    <input type="text" class="form-control" name="secondName" id="secondName"
                        aria-describedby="secondName" />
                </div>
            </div>
        </div>

        <div class="row mt-3" id="form-enterprise">
            <div class="col">
                <label for="name" class="form-label">Nombre:</label>
                <div class="input-group">
                    <input type="text" class="form-control" name="name" id="name" aria-describedby="name" />
                </div>
            </div>

            <div class="col">
                <label for="cif" class="form-label">CIF:</label>
                <div class="input-group">
                    <input type="text" class="form-control" name="cif" id="cif" aria-describedby="cif" />
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-lg btn-outline-dark w-100 mt-3 mb-3">Registrarse</button>

    </form>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            document.getElementById("role").addEventListener("change", function () {
                var role = document.getElementById("role").value;
                var divUser = document.getElementById("form-parker");
                var divEnterprise = document.getElementById("form-enterprise");
                var heading = document.getElementById("register-heading");

                if (role == "USER") {
                    divUser.style.display = "block";
                    divEnterprise.style.display = "none";
                    heading.innerHTML = "Registro de Parker";
                } else if (role == "ENTERPRISE") {
                    divUser.style.display = "none";
                    divEnterprise.style.display = "block";
                    heading.innerHTML = "Registro de Empresa";
                }
            })
        });

    </script>

</div>
